# Fly.io config for the Customer Helpdesk container.
# Deploy from this folder:  fly launch --copy-config --now   (or: fly deploy)
app = "customer-helpdesk"
primary_region = "sin"          # Singapore — close to Indonesian users; change as needed

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# Optional: uncomment for a durable SQLite file across restarts/redeploys.
# Note: a fresh volume shadows the baked-in data/ dir on first boot; the app
# reseeds the PIM catalog automatically, and you re-press SYNC to repopulate.
# [[mounts]]
#   source = "helpdesk_data"
#   destination = "/var/www/html/data"
